name: Deploy La Ultima Excursion to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_2B6F23110E1545EBAACF02F9864F0266 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_FA7A9F952EBF4EBF95714EC6472E359C }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_94807478F92C403FB91DE7809374A563 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: la-ultima-excursion
          slot-name: Production
          package: .
